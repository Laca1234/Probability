name: Windows validation and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install pinned runtime and build tools
        run: |
          python -m pip install --requirement requirements-lock.txt

      - name: Run mathematical and integration tests
        env:
          PYTHONPATH: src
        run: >-
          python -c "import sys,unittest; suite=unittest.defaultTestLoader.discover('tests'); result=unittest.TextTestRunner(verbosity=2).run(suite); sys.exit(not result.wasSuccessful())"

      - name: Build one-folder Windows application
        run: python -m PyInstaller --noconfirm --clean build/probability_of_us.spec

      - name: Smoke-test packaged Qt Quick startup
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QSG_RHI_BACKEND = 'software'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'ProbabilityOfUs-AppData'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          & '.\dist\ProbabilityOfUs\ProbabilityOfUs.exe' --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Packaged smoke test failed with exit code $LASTEXITCODE" }

      - name: Stage ZIP and checksums
        shell: pwsh
        run: .\build\package_release.ps1 -PythonExe (Get-Command python).Source -SmokeTestPassed

      - name: Upload one-folder build for review
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ProbabilityOfUs-Windows-x64
          path: |
            dist/ProbabilityOfUs/
            dist/ProbabilityOfUs-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

