[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "probability-of-us"
version = "0.1.0"
description = "A privacy-first desktop laboratory for demographic and relationship probability models"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Probability of Us contributors" }]
dependencies = [
  "PySide6==6.11.1",
  "numpy==2.3.4",
]

[project.optional-dependencies]
build = ["pyinstaller==6.20.0", "Pillow==12.0.0"]
dev = ["pytest==8.4.2", "hypothesis==6.142.4", "ruff==0.14.2", "mypy==1.18.2"]

[project.scripts]
probability-of-us = "probability_of_us.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
probability_of_us = ["ui/qml/*.qml", "assets/*.svg", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

